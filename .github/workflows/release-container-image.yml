name: Release Container Image

# Run after the Release workflow creates a GitHub Release.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-container-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BINARY_NAME: filepaste

jobs:
  build-arch-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get latest release tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          if gh release download "$TAG" --pattern "*$TARGET.tar.xz" --dir download; then
            echo "Downloaded the asset for $TARGET."
          fi

      - name: Extract Binary
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ env.BINARY_NAME }}
        run: |
          cd download
          tar -xvf -- *"$TARGET"*.tar.xz
          found_bin="$(find . -name "$BINARY_NAME" -type f | head -n 1)"
          if [ -z "$found_bin" ]; then
            echo "Could not find the binary $BINARY_NAME in the extracted files." >&2
            exit 1
          fi
          mv "$found_bin" "../$BINARY_NAME"
          chmod +x "../$BINARY_NAME"

      - name: Build and push intermediate image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: .github/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_tag.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            BINARY_NAME=${{ env.BINARY_NAME }}

  create-manifest:
    needs: build-arch-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Manifest
        env:
          BASE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.build-arch-images.outputs.tag }}
        run: |
          docker buildx imagetools create -t "${BASE}:${TAG}" \
            "${BASE}:${TAG}-amd64" \
            "${BASE}:${TAG}-arm64"
          docker buildx imagetools create -t "${BASE}:latest" \
            "${BASE}:${TAG}-amd64" \
            "${BASE}:${TAG}-arm64"
          echo "Pushed ${BASE}:${TAG} and ${BASE}:latest."
