name: Release Container Image

# Build the container image from the assets of one release tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag that holds the Linux assets.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that holds the Linux assets.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}-container-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BINARY_NAME: filepaste

jobs:
  build-arch-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p download
          asset="${BINARY_NAME}-${TARGET}.tar.xz"
          if ! gh release download "$TAG" --pattern "$asset" --dir download; then
            echo "error: The release asset ${asset} is missing from tag ${TAG}." >&2
            echo "error: Check the Release workflow result for that tag." >&2
            exit 1
          fi
          if [[ ! -f "download/${asset}" ]]; then
            echo "error: The release asset ${asset} is missing from tag ${TAG}." >&2
            echo "error: Check the Release workflow result for that tag." >&2
            exit 1
          fi

      - name: Extract the binary
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(download/*.tar.xz)
          if ((${#archives[@]} == 0)); then
            echo "error: No release archive is in the download directory." >&2
            exit 1
          fi
          if ((${#archives[@]} > 1)); then
            echo "error: More than one release archive is in the download directory." >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi
          tar -xJf "${archives[0]}" -C download
          found_bin="$(find download -type f -name "$BINARY_NAME" -print -quit)"
          if [[ -z "$found_bin" ]]; then
            echo "error: The binary ${BINARY_NAME} is missing from the release archive." >&2
            exit 1
          fi
          mv "$found_bin" "$BINARY_NAME"
          chmod +x "$BINARY_NAME"

      - name: Build and push intermediate image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: .github/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}-${{ matrix.arch }}
          build-args: |
            BINARY_NAME=${{ env.BINARY_NAME }}

  create-manifest:
    needs: build-arch-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          BASE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${BASE}:${TAG}" \
            "${BASE}:${TAG}-amd64" \
            "${BASE}:${TAG}-arm64"
          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [[ "$TAG" == "$latest" ]]; then
            docker buildx imagetools create -t "${BASE}:latest" \
              "${BASE}:${TAG}-amd64" \
              "${BASE}:${TAG}-arm64"
            echo "Pushed ${BASE}:${TAG} and ${BASE}:latest."
          else
            echo "Tag ${TAG} is older than the newest release ${latest}. The :latest tag was not updated."
          fi
