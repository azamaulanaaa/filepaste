<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Vault</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: monospace;
        overflow: hidden;
        background: #fff;
        color: #000;
      }
      #drop-zone {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
      }
      .center-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 250px;
        justify-content: center;
        width: 100%;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: auto auto 1fr;
        gap: 0 10px;
        text-align: left;
        width: fit-content;
        font-weight: normal;
        margin: 0 auto;
      }
      button {
        font-family: monospace;
        background: transparent;
        border: none;
        color: #000;
        padding: 10px 15px;
        cursor: pointer;
        transition: background 0.1s;
        text-transform: lowercase;
        font-weight: bold;
      }
      button:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      a {
        color: #000;
        text-decoration: underline;
        word-break: break-all;
        font-weight: bold;
      }
      .note {
        opacity: 0.4;
        font-size: 0.8em;
        margin-top: 30px;
        text-align: center;
        font-weight: normal;
      }
      #staging, #remote, #ui, #out {
        display: none;
      }
      .actions {
        display: flex;
        justify-content: center;
        width: 100%;
        margin-top: 20px;
        gap: 10px;
      }
      input[type="password"],
      input[type="text"],
      select {
        font-family: monospace;
        padding: 8px;
        border: 1px solid #ccc;
        outline: none;
        width: 240px;
        box-sizing: border-box;
        background: #fff;
        color: #000;
        height: 35px;
        margin: 5px 0;
        text-align: center;
      }

      select {
        cursor: pointer;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        text-align-last: center;
        border-radius: 0;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #000;
      }

      textarea {
        font-family: monospace;
        padding: 8px;
        border: 1px solid #ccc;
        outline: none;
        width: 340px;
        box-sizing: border-box;
        background: #fff;
        color: #000;
        margin: 5px 0;
        resize: vertical;
        text-align: left;
      }

      label {
        font-size: 0.8em;
        opacity: 0.6;
      }

      .error {
        max-width: 340px;
        margin: 10px auto 0;
        padding: 8px;
        border: 1px solid #000;
        font-size: 0.8em;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div id="drop-zone">
      <div class="center-wrap">
        <div id="idle" style="text-align: center">
          drag drop file or<br>
          <button onclick="document.getElementById('file-input').click()">
            [ select_file ]
          </button>
          <div style="margin-top: 15px">
            <button onclick="stageRemote()">[ fetch_url ]</button>
          </div>
        </div>

        <div id="staging" style="text-align: center">
          <div class="stat-grid">
            <span>file</span><span>:</span><span id="st-fn"></span>
            <span>size</span><span>:</span><span id="st-fs"></span>
          </div>

          <div class="input-group">
            <input
              type="text"
              id="auth-totp"
              placeholder="6-digit totp"
              maxlength="6"
              inputmode="numeric"
              pattern="[0-9]*"
              autocomplete="one-time-code"
            >
            <input
              type="password"
              id="dl-pw"
              placeholder="auth password"
              autocomplete="off"
            >
            <select id="retention-select">
              <option value="6">6 hours</option>
              <option value="24" selected>24 hours</option>
              <option value="72">3 days</option>
              <option value="168">7 days</option>
            </select>
          </div>

          <div class="actions">
            <button onclick="startUpload()">[ start_upload ]</button>
            <button onclick="resetUI()">[ cancel ]</button>
          </div>
        </div>

        <div id="remote" style="text-align: center">
          <div id="remote-form">
            <div class="input-group">
              <label for="remote-command">curl command or URL</label>
              <textarea
                id="remote-command"
                rows="3"
                placeholder="curl -L https://example.com/report.pdf"
                spellcheck="false"
              ></textarea>
              <input
                type="text"
                id="remote-totp"
                placeholder="6-digit totp"
                maxlength="6"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
              >
              <input
                type="password"
                id="remote-pw"
                placeholder="auth password"
                autocomplete="off"
              >
              <select id="remote-retention-select">
                <option value="6">6 hours</option>
                <option value="24" selected>24 hours</option>
                <option value="72">3 days</option>
                <option value="168">7 days</option>
              </select>
            </div>

            <div id="remote-error" class="error" style="display: none"></div>

            <div class="actions">
              <button id="remote-submit" onclick="startRemoteUpload()">
                [ start_fetch ]
              </button>
              <button onclick="resetUI()">[ cancel ]</button>
            </div>
          </div>

          <div id="remote-pending" style="display: none">
            <div>fetching remote file... <span id="remote-progress"></span></div>
            <div class="actions">
              <button onclick="resetUI()">[ abort_fetch ]</button>
            </div>
          </div>
        </div>

        <div id="ui">
          <div class="stat-grid">
            <span>file</span><span>:</span><span id="fn"></span>
            <span>size</span><span>:</span><span id="fs"></span>
            <span>prog</span><span>:</span><span>[ <span id="pc">0%</span>
              ]</span>
          </div>
          <div class="actions">
            <button onclick="if(xhr) xhr.abort(); resetUI();">
              [ abort_transfer ]
            </button>
          </div>
        </div>

        <div id="out">
          <div class="stat-grid">
            <span>link</span><span>:</span><span><a
                id="ln"
                target="_blank"
              ></a></span>
          </div>
          <div class="actions">
            <button onclick="copyUrl(this)">[ copy_link ]</button>
            <button onclick="resetUI()">[ new_upload ]</button>
          </div>
        </div>

        <div class="note">authenticated file storage</div>
      </div>
    </div>

    <input
      type="file"
      id="file-input"
      style="display: none"
      onchange="stageFile(this.files[0])"
    >

    <script>
      const zone = document.getElementById("drop-zone");
      let xhr = null;
      let remoteXhr = null;
      let remoteJob = null;
      let remoteTimer = null;
      let remotePoll = null;
      let pendingFile = null;

      window.ondragover = (e) => {
        e.preventDefault();
        zone.style.background = "rgba(0,0,0,0.01)";
      };
      window.ondragleave = () => {
        zone.style.background = "#fff";
      };
      window.ondrop = (e) => {
        e.preventDefault();
        zone.style.background = "#fff";
        stageFile(e.dataTransfer.files[0]);
      };

      function stageFile(file) {
        if (!file) return;
        cancelRemote();
        pendingFile = file;
        document.getElementById("st-fn").textContent = file.name;
        document.getElementById("st-fs").textContent =
          (file.size / 1024 / 1024).toFixed(2) + " mb";
        document.getElementById("dl-pw").value = "";
        document.getElementById("auth-totp").value = ""; // Clear TOTP
        document.getElementById("idle").style.display = "none";
        document.getElementById("staging").style.display = "block";
        document.getElementById("auth-totp").focus(); // Focus TOTP first
      }

      function stageRemote() {
        document.getElementById("idle").style.display = "none";
        document.getElementById("remote").style.display = "block";
        document.getElementById("remote-command").focus();
      }

      function cancelRemote() {
        clearTimeout(remoteTimer);
        remoteTimer = null;
        if (remotePoll) {
          const controller = remotePoll;
          remotePoll = null;
          controller.abort();
        }
        if (remoteJob) {
          const job = remoteJob;
          remoteJob = null;
          cancelRemoteJob(job);
        }
        if (remoteXhr) {
          const request = remoteXhr;
          remoteXhr = null;
          request.abort();
        }
        document.getElementById("remote").style.display = "none";
        document.getElementById("remote-command").value = "";
        document.getElementById("remote-totp").value = "";
        document.getElementById("remote-pw").value = "";
        document.getElementById("remote-retention-select").value = "24";
        document.getElementById("remote-progress").textContent = "";
        document.getElementById("remote-error").textContent = "";
        document.getElementById("remote-error").style.display = "none";
        document.getElementById("remote-form").style.display = "block";
        document.getElementById("remote-pending").style.display = "none";
        document.getElementById("remote-submit").disabled = false;
      }

      function cancelRemoteJob(job) {
        fetch("/api/remote-uploads/" + encodeURIComponent(job.id), {
          method: "DELETE",
          headers: { Authorization: "Bearer " + job.token },
        }).catch(() => {});
      }

      function remoteSize(bytes) {
        if (bytes < 1024) return bytes + " b";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " kb";
        return (bytes / 1024 / 1024).toFixed(1) + " mb";
      }

      function showRemoteProgress(job) {
        const received = job.received_bytes || 0;
        let text = remoteSize(received);
        if (job.total_bytes != null) {
          const percent = job.total_bytes > 0
            ? Math.min(100, Math.floor((received / job.total_bytes) * 100))
            : 100;
          text = percent + "% (" + remoteSize(received) + " / " +
            remoteSize(job.total_bytes) + ")";
        }
        document.getElementById("remote-progress").textContent = text;
      }

      function showRemoteFailure(message) {
        document.getElementById("remote-pending").style.display = "none";
        document.getElementById("remote-form").style.display = "block";
        document.getElementById("remote-submit").disabled = false;
        showRemoteError(message);
      }

      function showRemoteError(message) {
        const errorEl = document.getElementById("remote-error");
        errorEl.textContent = message;
        errorEl.style.display = "block";
      }

      function showResult(serverUrl) {
        const linkEl = document.getElementById("ln");
        linkEl.href = serverUrl;
        linkEl.textContent = serverUrl;
        document.getElementById("staging").style.display = "none";
        document.getElementById("remote").style.display = "none";
        document.getElementById("ui").style.display = "none";
        document.getElementById("out").style.display = "block";
      }

      function startRemoteUpload() {
        if (remoteXhr || remoteJob) return;

        const typed = document.getElementById("remote-command").value.trim();
        const totp = document.getElementById("remote-totp").value;
        const pw = document.getElementById("remote-pw").value;
        const retentionHours =
          document.getElementById("remote-retention-select").value;

        if (totp.length !== 6 || isNaN(totp)) {
          showRemoteError("Enter a valid 6-digit TOTP code.");
          return;
        }
        if (!typed) {
          showRemoteError("Enter a curl command or URL.");
          return;
        }

        const command = /^https?:\/\//i.test(typed) ? "curl " + typed : typed;

        document.getElementById("remote-error").style.display = "none";

        const request = new XMLHttpRequest();
        remoteXhr = request;
        request.open("POST", "/api/remote-uploads", true);
        request.setRequestHeader("Content-Type", "text/plain; charset=utf-8");
        request.setRequestHeader("X-Retention-Hour", retentionHours);
        request.setRequestHeader(
          "Authorization",
          "Basic " + btoa(totp + ":" + pw),
        );

        request.onload = () => {
          if (remoteXhr !== request) return;
          remoteXhr = null;
          if (request.status >= 200 && request.status < 300) {
            let job = null;
            try {
              job = JSON.parse(request.responseText);
            } catch (_) {}
            if (!job || !job.id || !job.token) {
              showRemoteFailure("Invalid job response.");
              return;
            }
            remoteJob = job;
            showRemoteProgress(job);
            pollRemoteJob(job);
            return;
          }
          document.getElementById("remote-pending").style.display = "none";
          document.getElementById("remote-form").style.display = "block";
          document.getElementById("remote-submit").disabled = false;
          showRemoteError(
            "HTTP " + request.status + remoteErrorDetail(request),
          );
        };

        request.onerror = () => {
          if (remoteXhr !== request) return;
          remoteXhr = null;
          document.getElementById("remote-pending").style.display = "none";
          document.getElementById("remote-form").style.display = "block";
          document.getElementById("remote-submit").disabled = false;
          showRemoteError("Fetch failed. Server unreachable.");
        };

        document.getElementById("remote-form").style.display = "none";
        document.getElementById("remote-pending").style.display = "block";
        document.getElementById("remote-progress").textContent = "0 b";
        document.getElementById("remote-submit").disabled = true;
        request.send(command);
      }

      function remoteErrorDetail(request) {
        const text = request.responseText.trim();
        try {
          const data = JSON.parse(request.responseText);
          if (data && data.error) return "\n" + data.error;
        } catch (_) {}
        return text ? "\n" + text : "";
      }

      function pollRemoteJob(job) {
        remoteTimer = setTimeout(() => {
          remoteTimer = null;
          if (!remoteJob || remoteJob.id !== job.id) return;
          const controller = new AbortController();
          remotePoll = controller;
          fetch("/api/remote-uploads/" + encodeURIComponent(job.id), {
            headers: { Authorization: "Bearer " + job.token },
            cache: "no-store",
            signal: controller.signal,
          })
            .then(async (response) => {
              let data = null;
              try {
                data = await response.json();
              } catch (_) {}
              if (!response.ok) {
                const detail = data && data.error ? ": " + data.error : "";
                throw new Error("HTTP " + response.status + detail);
              }
              return data;
            })
            .then((data) => {
              if (remotePoll === controller) remotePoll = null;
              if (!remoteJob || remoteJob.id !== job.id) return;
              if (!data || !data.state) {
                throw new Error("Invalid job status.");
              }
              showRemoteProgress(data);
              if (data.state === "done") {
                remoteJob = null;
                document.getElementById("remote-pending").style.display =
                  "none";
                showResult(data.url);
              } else if (data.state === "failed") {
                remoteJob = null;
                showRemoteFailure(data.error || "Fetch failed.");
              } else {
                pollRemoteJob(job);
              }
            })
            .catch((error) => {
              if (remotePoll === controller) remotePoll = null;
              if (error.name === "AbortError") return;
              if (!remoteJob || remoteJob.id !== job.id) return;
              remoteJob = null;
              cancelRemoteJob(job);
              showRemoteFailure(
                error.message || "Fetch failed. Server unreachable.",
              );
            });
        }, 500);
      }

      function startUpload() {
        if (!pendingFile) return;
        const file = pendingFile;
        const pw = document.getElementById("dl-pw").value;
        const totp = document.getElementById("auth-totp").value; // Get TOTP
        const retentionHours =
          document.getElementById("retention-select").value;

        if (totp.length !== 6 || isNaN(totp)) {
          alert("Please enter a valid 6-digit TOTP code.");
          return;
        }

        document.getElementById("fn").textContent = file.name;
        document.getElementById("fs").textContent =
          (file.size / 1024 / 1024).toFixed(2) + " mb";
        document.getElementById("pc").textContent = "0%";
        document.getElementById("staging").style.display = "none";
        document.getElementById("ui").style.display = "block";

        xhr = new XMLHttpRequest();
        xhr.open("PUT", "/" + encodeURIComponent(file.name), true);
        xhr.setRequestHeader("X-Retention-Hour", retentionHours);

        // Uses TOTP as the 'user' part of Basic Auth
        const creds = btoa(totp + ":" + pw);
        xhr.setRequestHeader("Authorization", "Basic " + creds);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            document.getElementById("pc").textContent =
              Math.round((e.loaded / e.total) * 100) + "%";
          }
        };

        xhr.onerror = () => {
          alert("Upload failed. Server unreachable.");
          resetUI();
        };

        xhr.onload = () => {
          if (xhr.status === 200) {
            const serverUrl = xhr.responseText.trim();
            const linkEl = document.getElementById("ln");
            linkEl.href = serverUrl;
            linkEl.textContent = serverUrl;
            document.getElementById("ui").style.display = "none";
            document.getElementById("out").style.display = "block";
          } else {
            alert(
              "Upload rejected: HTTP " + xhr.status + "\n" +
                xhr.responseText,
            );
            resetUI();
          }
        };

        xhr.send(file);
      }

      function resetUI() {
        pendingFile = null;
        cancelRemote();
        document.getElementById("file-input").value = "";
        document.getElementById("idle").style.display = "block";
        document.getElementById("staging").style.display = "none";
        document.getElementById("ui").style.display = "none";
        document.getElementById("out").style.display = "none";
        document.getElementById("retention-select").value = "24";
      }

      function copyUrl(btn) {
        const link = document.getElementById("ln").href;
        navigator.clipboard.writeText(link).then(() => {
          const old = btn.textContent;
          btn.textContent = "[ copied ]";
          setTimeout(() => btn.textContent = old, 1000);
        });
      }
    </script>
  </body>
</html>
